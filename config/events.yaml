# Key events for the analysis and chart annotations.
# Each entry gives its source. "checked" = page read while building the project;
# "reference" = official text identified but not fetched (legifrance.gouv.fr refuses automated requests).

# 2022 state discount at the pump ("remise carburant"), mainland France.
# The discount was deducted at the till by every station and the prices reported to prix-carburants.gouv.fr
# are the prices displayed at the pump, i.e. NET of the discount. To get the distributor's own pre-tax price,
# the HT amount of the discount is added back: price_ht = price_ttc / (1 + VAT) - excise + discount_ht.
discount_periods:
  - start: 2022-04-01
    end: 2022-08-31
    amount_ht: 0.15
    amount_ttc_mainland: 0.18
    label: "Remise 18 cts"
    sources:
      - url: "https://www.lafinancepourtous.com/2022/11/14/baisse-de-la-remise-carburant-le-16-novembre-2022/"
        status: checked
        quote: "0,18 €/litre d'avril au 31 août 2022"
      - url: "https://www.info.gouv.fr/actualite/15-centimes-en-moins-par-litre-de-carburant-des-le-1er-avril"
        status: reference
      - ref: "Décret n° 2022-423 du 25 mars 2022 (15 c€ HT, 1 April - 31 July), extended to 31 August by décret n° 2022-1042 (July 2022)"
        status: reference
  - start: 2022-09-01
    end: 2022-11-15
    amount_ht: 0.25
    amount_ttc_mainland: 0.30
    label: "Remise 30 cts"
    sources:
      - url: "https://www.ecologie.gouv.fr/prix-des-carburants-remise-30-centimes-litre"
        status: checked
        quote: "Une aide de 30 centimes d'euros TTC (25 centimes d'euros HT) du 1er septembre au 31 octobre"
      - url: "https://www.lafinancepourtous.com/2022/11/14/baisse-de-la-remise-carburant-le-16-novembre-2022/"
        status: checked
        quote: "septembre au 15 novembre (montant de la remise initialement prévu jusqu'au 31 octobre)"
      - url: "https://www.info.gouv.fr/actualite/la-remise-carburant-prolongee-jusqua-mi-novembre"
        status: reference
  - start: 2022-11-16
    end: 2022-12-31
    amount_ht: 0.0833
    amount_ttc_mainland: 0.10
    label: "Remise 10 cts"
    sources:
      - url: "https://www.lafinancepourtous.com/2022/11/14/baisse-de-la-remise-carburant-le-16-novembre-2022/"
        status: checked
        quote: "0,10 €/litre du 16 novembre au 31 décembre 2022"
      - url: "https://www.ecologie.gouv.fr/prix-des-carburants-remise-30-centimes-litre"
        status: checked
        quote: "10 centimes d'euros TTC (8,33 centimes d'euros HT)"

# Corsica (VAT 13%): same HT amounts, so the TTC equivalent is HT * 1.13 (e.g. 28,25 cts for 25 cts HT),
# as stated on the ecologie.gouv.fr page above.

# TotalEnergies' own rebate, on top of the state discount, at its French stations (company decision,
# applied at the pump). Only relevant for brand comparisons in 2022.
company_rebates:
  - brand: TotalEnergies
    start: 2022-09-01
    end: 2022-11-15
    amount_ttc: 0.20
    sources:
      - url: "https://www.lafinancepourtous.com/2022/11/14/baisse-de-la-remise-carburant-le-16-novembre-2022/"
        status: checked
        quote: "La remise supplémentaire pratiquée par les stations-services de Total Energie, diminue également le 16 novembre, de 0,20 €/litre à 0,10 €/litre"
      - url: "https://totalenergies.com/fr/node/19816"
        status: reference
  - brand: TotalEnergies
    start: 2022-11-16
    end: 2022-12-31
    amount_ttc: 0.10
    sources:
      - url: "https://www.lafinancepourtous.com/2022/11/14/baisse-de-la-remise-carburant-le-16-novembre-2022/"
        status: checked

